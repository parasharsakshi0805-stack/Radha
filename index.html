<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radha - Cinematic Romantic Experience</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for Elegant Hindi Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amita:wght@400;700&family=Yatra+One&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Background layers -->
    <div class="galaxy-bg"></div>
    <canvas id="galaxy-canvas"></canvas>
    
    <!-- Floating text -->
    <div class="floating-text-container" id="floating-text-container"></div>
    
    <!-- Heart shape formed by text -->
    <div class="heart-container-wrapper">
        <div class="heart-container" id="heart-container">
            <!-- Words will be injected here via JS -->
        </div>
    </div>
    
    <!-- Footer -->
    <div class="footer-text">
        राधा <span class="heart-icon">❤️</span>
    </div>
    <script src="script.js"></script>
</body>
</html>
